name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../slack-cli-${{ matrix.target }}.tar.gz slack-cli
          cd ../../..
          shasum -a 256 slack-cli-${{ matrix.target }}.tar.gz > slack-cli-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slack-cli-${{ matrix.target }}
          path: |
            slack-cli-${{ matrix.target }}.tar.gz
            slack-cli-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            slack-cli-*.tar.gz
            slack-cli-*.tar.gz.sha256

  # HOMEBREW_TAP_TOKEN が未設定の間はここだけ落ちる。リリース自体は成立しているので
  # 全体を赤くしない（トークンを入れた時点で自動更新に切り替わる）。
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slack-cli-aarch64-apple-darwin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slack-cli-x86_64-apple-darwin

      - name: Get SHA256
        id: sha
        run: |
          echo "arm64=$(awk '{print $1}' slack-cli-aarch64-apple-darwin.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "x86_64=$(awk '{print $1}' slack-cli-x86_64-apple-darwin.tar.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew Formula
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: mimo-3/homebrew-tap
          event-type: update-slack-cli-formula
          client-payload: |
            {
              "version": "${{ github.ref_name }}",
              "arm64_sha256": "${{ steps.sha.outputs.arm64 }}",
              "x86_64_sha256": "${{ steps.sha.outputs.x86_64 }}"
            }
